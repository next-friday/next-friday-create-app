schema_version: "1.1"
name: interviews-before-writing-intent
expected_outcome: |
  The agent picks the intent playbook and asks its open questions in plain chat text, with no answer offered. It writes no intent yet.
graders:
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: no-branch-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-{1,2}(?:a|r|v|vv|l|list|show-current|contains|merged|no-merged|all|remotes|format|sort|points-at)\b)[\w-]|worktree\s+add)'
    min: 0
    max: 0
  - name: no-intent-written
    type: tool_used
    tool: Write
    input_match: 'intent\.md'
    min: 0
    max: 0
  - name: no-intent-created
    type: regex
    pattern: 'intent\.md$'
    flags: m
    match: not_contains
    target: files
  - name: reply-holds-no-steps-section
    type: regex
    pattern: '^\*\*Steps'
    flags: mu
    match: not_contains
  - name: no-push-or-pull-request-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bpush\b|\bpr\s+create\b'
    min: 0
    max: 0
