schema_version: "1.1"
name: blocked-gate-is-reported
expected_outcome: |
  A push of a new feature was refused because the branch adds no plan. The agent reports the refusal and starts the work from an intent. It writes no plan.md in a folder that has no intent.md and no spec.md.
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-plan-written
    type: tool_used
    tool: Write
    input_match: 'intent/[^/"]+/plan\.md'
    min: 0
    max: 0
  - name: no-plan-edited
    type: tool_used
    tool: Edit
    input_match: 'intent/[^/"]+/plan\.md'
    min: 0
    max: 0
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: reply-points-to-an-intent
    type: regex
    pattern: '/(?:sdlc:)?sdlc-mode\b|intent\.md|\b(?:an|the) intent\b'
    flags: imu
