schema_version: "1.1"
name: waits-for-the-reviewer-without-polling
expected_outcome: |
  The branch feat/app-version holds a change with one bug. The agent starts the reviewer as a subagent, waits for its report, and writes its reply from that report. While the reviewer runs, the agent does not sleep, does not loop, and does not message the subagent.
context:
  scaffold_script: scaffold.sh
graders:
  - name: review-runs-in-a-subagent
    type: tool_used
    tool: Agent
    min: 1
  - name: no-fixed-sleep
    type: tool_used
    tool: Bash
    input_match: '\bsleep\b'
    min: 0
    max: 0
  - name: no-polling-loop
    type: tool_used
    tool: Bash
    input_match: '\b(?:until|while)\b[^"]*;\s*do\b'
    min: 0
    max: 0
  - name: no-message-to-the-subagent
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
  - name: reply-comes-from-the-report
    type: regex
    pattern: 'src/version/version\.controller\.ts:\d+'
    flags: mu
  - name: no-file-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-file-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
