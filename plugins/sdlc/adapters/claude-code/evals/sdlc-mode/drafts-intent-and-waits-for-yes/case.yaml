schema_version: "1.1"
name: drafts-intent-and-waits-for-yes
expected_outcome: |
  The agent writes `intent/<change>/intent.md` from the template, shows the whole draft, and asks whether it matches. It does not commit, push, or open a pull request before the originator says yes.
context:
  scaffold_script: scaffold.sh
graders:
  - name: intent-file-exists
    type: file_exists
    path: intent/*/intent.md
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: no-branch-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-{1,2}(?:a|r|v|vv|l|list|show-current|contains|merged|no-merged|all|remotes|format|sort|points-at)\b)[\w-]|worktree\s+add)'
    min: 0
    max: 0
  - name: intent-has-the-five-headings
    type: tool_used
    tool: Write
    input_match: 'intent/[^/\"]+/intent\.md[\s\S]*## Problem[\s\S]*## Proposed outcome[\s\S]*## Affected users and systems[\s\S]*## Constraints[\s\S]*## Open questions'
    min: 1
  - name: reply-shows-the-draft-and-asks
    type: regex
    pattern: '(?=[\s\S]*## Problem)(?=[\s\S]*## Open questions)(?=[\s\S]*(?:\?|\byes\b|\bmatch(?:es)?\b))'
    flags: mu
  - name: no-push-or-pull-request-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bpush\b|\bpr\s+create\b'
    min: 0
    max: 0
  - name: reply-holds-no-steps-section
    type: regex
    pattern: '^\*\*Steps'
    flags: mu
    match: not_contains
  - name: author-is-the-originators-handle
    type: tool_used
    tool: Write
    input_match: 'intent\.md[\s\S]*Author: [^\\]*@joe-acct'
    min: 1
  - name: author-is-not-the-git-name
    type: tool_used
    tool: Write
    input_match: 'Author: [^\\]*Eval Author'
    min: 0
    max: 0
  - name: open-questions-names-the-other-repository
    type: tool_used
    tool: Write
    input_match: 'intent\.md[\s\S]*## Open questions(?:\\n)+[\s\S]*(?:web-app|Finance Tools)'
    min: 1
