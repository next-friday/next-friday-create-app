schema_version: "1.1"
name: interviews-before-writing-intent
expected_outcome: |
  The agent restates the goal, picks the plan playbook, and asks one question, with the answer it recommends first, by the session's question tool or in the reply. It writes no intent yet.
graders:
  - name: no-commit-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: no-branch-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-{1,2}(?:a|r|v|vv|l|list|show-current|contains|merged|no-merged|all|remotes|format|sort|points-at)\b)[\w-]|worktree\s+add)'
    min: 0
    max: 0
