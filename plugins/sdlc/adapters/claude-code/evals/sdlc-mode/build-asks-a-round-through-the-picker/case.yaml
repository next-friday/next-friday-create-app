schema_version: "1.1"
name: build-asks-a-round-through-the-picker
expected_outcome: |
  The spec intent/app-version/spec.md is merged and has no plan, and the request names no files, order of work, or tests. The session offers a question picker. The agent reads the intent, the spec, and the code, and asks the engineer for the missing things in one round through the question picker, with the answer it recommends first. It shows no plan yet, and writes no file.
context:
  scaffold_script: scaffold.sh
graders:
  - name: round-is-asked-through-the-picker
    type: tool_used
    tool: AskUserQuestion
    min: 1
  - name: reply-has-no-plan-headings
    type: regex
    pattern: '(?=[\s\S]*Files that change)(?=[\s\S]*Order of work)(?=[\s\S]*Risks)(?=[\s\S]*Proof)'
    flags: mu
    match: not_contains
  - name: no-file-created
    type: regex
    target: files
    pattern: '^(?!\.git/config\.worktree$|\.git/objects/info/alternates$).+$'
    flags: m
    match: not_contains
  - name: no-file-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-file-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
