schema_version: "1.1"
name: writes-spec-from-merged-intent
expected_outcome: |
  The intent intent/csv-export/intent.md is merged and has no spec. The agent follows the design playbook: it reads the four policies, writes intent/csv-export/spec.md from the template, starts a branch, and waits at the gate for the product owner. It does not merge.
context:
  scaffold_script: scaffold.sh
graders:
  - name: spec-file-exists
    type: file_exists
    path: intent/csv-export/spec.md
  - name: spec-has-five-headings
    type: regex
    pattern: '(?=[\s\S]*^## Requirements$)(?=[\s\S]*^## Design$)(?=[\s\S]*^## Policies$)(?=[\s\S]*^## Areas of concern$)(?=[\s\S]*^## Open questions$)'
    flags: mu
    target:
      source: file
      path: intent/csv-export/spec.md
  - name: branch-is-checked-out
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:checkout|switch)\s+(?:-\S+\s+)*(?!main$).+'
    min: 1
  - name: spec-records-the-skills-commit
    type: regex
    pattern: '^Request: .*Skills at `?(?:[0-9a-f]{7,40}|unknown)`?\.$'
    flags: mu
    target:
      source: file
      path: intent/csv-export/spec.md
  - name: policies-has-one-line-per-policy
    type: regex
    pattern: '^## Policies$(?=(?:(?!^## )[\s\S])*\bbrand\b)(?=(?:(?!^## )[\s\S])*\bsecurity\b)(?=(?:(?!^## )[\s\S])*\bcompliance\b)(?=(?:(?!^## )[\s\S])*\bUX\b)'
    flags: imu
    target:
      source: file
      path: intent/csv-export/spec.md
  - name: no-policy-is-called-unwritten
    type: regex
    pattern: "not (?:yet )?written"
    flags: imu
    match: not_contains
    target:
      source: file
      path: intent/csv-export/spec.md
  - name: reply-names-the-product-owner
    type: regex
    pattern: "product owner"
    flags: imu
  - name: no-merge-or-approve-command
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+merge\b|\bpr\s+merge\b|\bpr\s+review\b'
    min: 0
    max: 0
  - name: brand-policy-is-read
    type: regex
    target: trace
    pattern: '# Brand policy\b'
    flags: u
  - name: security-policy-is-read
    type: regex
    target: trace
    pattern: '# Security policy\b'
    flags: u
  - name: compliance-policy-is-read
    type: regex
    target: trace
    pattern: '# Compliance policy\b'
    flags: u
  - name: ux-policy-is-read
    type: regex
    target: trace
    pattern: '# UX policy\b'
    flags: u
  - name: each-concern-has-a-decision
    type: regex
    pattern: '^## Areas of concern$(?:(?!^## )[\s\S])*?^\d+\.(?:(?!Decision:|^## )[\s\S])*?(?=^\d+\.|^## |(?![\s\S]))'
    flags: mu
    match: not_contains
    target:
      source: file
      path: intent/csv-export/spec.md
