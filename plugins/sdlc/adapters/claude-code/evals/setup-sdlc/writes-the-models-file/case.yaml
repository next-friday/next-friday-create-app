schema_version: "1.1"
name: writes-the-models-file
expected_outcome: |
  The request states the budget `medium`, so the agent asks no question. The run's home directory is closed to it, so it shows `~/.claude/rules/sdlc-loopls.md` in the fixed shape, with the default model of each of the four roles and the effort `high`, for the person to save, and writes no models file in the project. The request does not hold the word `project`, so the agent does not read `SETUP.md`, reports no step of it, and touches no file of the project.
context:
  scaffold_script: scaffold.sh
graders:
  - name: reply-gives-the-rule-with-the-defaults-at-the-medium-effort
    type: regex
    pattern: 'rules/sdlc-loopls\.md[\s\S]*budget: medium \(high\)\s*\n\s*main: (?:claude-)?sonnet\S* high\s*\n\s*explore: (?:claude-)?haiku\S* high\s*\n\s*advise: (?:claude-)?opus\S* high'
  - name: no-models-file-in-the-project
    type: regex
    target: files
    pattern: '^\.agents/sdlc-loopls\.md$'
    flags: m
    match: not_contains
  - name: setup-file-is-not-read
    type: tool_used
    tool: Read
    input_match: 'SETUP\.md'
    min: 0
    max: 0
  - name: no-file-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: package-json-is-unchanged
    type: regex
    pattern: '^  "description": "Orders service for the web shop",$'
    flags: m
    target:
      source: file
      path: package.json
  - name: no-question-tool
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: reply-asks-no-budget-question
    type: regex
    pattern: 'budget[^\n]*\?'
    flags: imu
    match: not_contains
  - name: reply-reports-no-setup-step
    type: regex
    pattern: "Branch protection|Project description"
    flags: imu
    match: not_contains
