schema_version: "1.1"
name: second-run-changes-nothing
expected_outcome: |
  The person's rule already holds exactly what a first run writes for the budget `medium`; the run's home directory is closed, so the request gives the rule's lines, and it states the same budget. The request holds the word `project`, so the agent reads `SETUP.md`, reports the project description step as done and the branch protection step as a person's, and changes no line of the rule.
context:
  scaffold_script: scaffold.sh
graders:
  - name: rule-keeps-its-lines
    type: tool_used
    tool: Write
    input_match: '^(?=[\s\S]*rules/sdlc-loopls\.md)(?![\s\S]*budget: medium \(high\)[\s\S]*main: (?:claude-)?sonnet\S* high[\s\S]*explore: (?:claude-)?haiku\S* high[\s\S]*advise: (?:claude-)?opus\S* high)'
    min: 0
    max: 0
  - name: package-json-is-unchanged
    type: regex
    pattern: '^  "description": "Orders service for the web shop",$'
    flags: m
    target:
      source: file
      path: package.json
  - name: setup-file-is-read
    type: tool_used
    tool: Read
    input_match: 'SETUP\.md'
    min: 1
    arm: both
  - name: reply-reports-the-description-step-as-done
    type: regex
    pattern: 'Project description[^\n]*\b(?:done|already)\b'
    flags: imu
  - name: reply-leaves-branch-protection-to-a-person
    type: regex
    pattern: 'Branch protection[^\n]*\b(?:person|admin|you|owner|someone)\b'
    flags: imu
  - name: reply-does-not-claim-branch-protection
    type: regex
    pattern: 'Branch protection[^\n]*:\s*\**(?:done|verified)\b'
    flags: imu
    match: not_contains
