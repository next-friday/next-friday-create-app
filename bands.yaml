# Detection settings for one metric: the tiers' actions, tools, and routes. `node .claude/skills/sdlc-mode/scripts/check-bands.ts <file>` reads this file.
# The metric is this project's to set. Tiers are sample standard deviations from the baseline's mean.
# The metric command writes the baseline window and the recent values; this file sets no window.
metric: ci_test_failure_rate
rules: western_electric
tiers:
  1sigma: {action: log}
  2sigma: {action: diagnose, tools: "Read,Grep,Bash(gh run view *)"}
  3sigma: {action: propose, routes: [pull_request]}
